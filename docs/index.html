<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按可复核公开指数比较A股主题板块多周期涨跌。"><title>板块雷达 · 长期涨跌</title><style>:root{--ink:#172033;--muted:#667085;--line:#e5eaf1;--paper:#f6f8fc;--blue:#2457d6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px 34px 48px}.top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.12em}.title{font-size:34px;letter-spacing:-.04em;margin:6px 0}.subtitle{margin:0;color:var(--muted);font-size:15px}.live{background:#fff;border:1px solid var(--line);padding:11px 14px;border-radius:10px;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ed9a22;margin-right:7px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;justify-content:space-between}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;font:inherit;cursor:pointer}.tab.active{background:#e9efff;color:#1646be;font-weight:750}.search{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;min-width:230px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px}.metric strong{font-size:24px;display:block;margin-top:4px}.metric span{font-size:13px;color:var(--muted)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:960px}.table th{text-align:left;color:var(--muted);font-size:13px;font-weight:650;background:#fafbfe;padding:14px 18px;border-bottom:1px solid var(--line)}.table td{padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px}.table tr:last-child td{border-bottom:0}.name{font-size:16px;font-weight:750}.empty{color:#98a2b3}.notice{margin-top:16px;padding:14px 16px;background:#fff8e9;border:1px solid #f7d99d;color:#76540f;border-radius:10px;font-size:14px;line-height:1.55}.footer{font-size:13px;color:var(--muted);margin-top:18px}@media(max-width:700px){main{padding:20px 14px}.top{align-items:start;flex-direction:column}.title{font-size:28px}.toolbar{align-items:stretch;flex-direction:column}.search{min-width:0}.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:span 2}}</style></head><body><main><section class="top"><div><div class="eyebrow">SECTOR RADAR / OPEN DATA</div><h1 class="title">板块长期涨跌雷达</h1><p class="subtitle">按可追溯公开基准计算；切换周期即可查看横向排名。</p></div><div class="live"><span class="dot"></span>数据配置中 · 不展示未核验收益</div></section><section class="toolbar"><div class="tabs" id="tabs"></div><input class="search" id="search" placeholder="搜索板块或基准代码"></section><section class="metrics"><div class="metric"><span>纳入板块</span><strong id="total">—</strong></div><div class="metric"><span>已绑定基准</span><strong id="bound">—</strong></div><div class="metric"><span>最近同步</span><strong>待初始化</strong></div></section><section class="table-wrap"><table class="table"><thead><tr><th>板块</th><th>公开基准</th><th id="period">近1年涨跌</th><th>数据来源 / 口径</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></section><div class="notice">为避免误导，未绑定公开指数或可复核价格序列的主题不显示收益。请在仓库的 <code>data/sectors.json</code> 绑定基准后，工作流会在每个交易日自动刷新。</div><p class="footer">收益按最近可用交易日的收盘价计算；仅供研究，不构成投资建议。</p></main><script>const periods=['近10年','近5年','近3年','近1年','近6个月','近3个月','近1个月','近1周'];let current='近1年',data=[];const tabs=document.querySelector('#tabs');periods.forEach(p=>{const b=document.createElement('button');b.className='tab'+(p===current?' active':'');b.textContent=p;b.onclick=()=>{current=p;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};tabs.append(b)});function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const list=data.filter(x=>(x.name+x.benchmark+x.source).toLowerCase().includes(q));document.querySelector('#period').textContent=current+'涨跌';document.querySelector('#rows').innerHTML=list.map(x=>`<tr><td><span class="name">${x.name}</span></td><td><b>${x.benchmark}</b></td><td class="empty">—</td><td>${x.source}</td><td><span class="empty">${x.benchmark==='待绑定'?'待绑定':'等待首轮同步'}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">没有匹配的板块</td></tr>'}document.querySelector('#search').oninput=render;fetch('data/sectors.json').then(r=>r.json()).then(x=>{data=x;document.querySelector('#total').textContent=x.length;document.querySelector('#bound').textContent=x.filter(a=>a.benchmark!=='待绑定').length;render()}).catch(()=>document.querySelector('#rows').innerHTML='<tr><td colspan="5">数据文件加载失败</td></tr>')</script></body></html>
