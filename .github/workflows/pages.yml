name: Deploy Sector Radar
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build market data
        run: |
          python scripts/update_data.py
          python scripts/add_us_indices.py
          python scripts/add_daily_history.py
          python scripts/upgrade_benchmarks.py
          python scripts/add_sector_funds.py
          python scripts/repair_fund_history.py
          python scripts/add_etf_metadata.py
          python scripts/add_fund_ui.py
          python scripts/add_radar_v15.py
          python scripts/add_radar_v20.py
          python scripts/add_research_terminal.py
          python scripts/add_theme_ui.py
          python scripts/add_compact_stats.py
          sed -i 's|^<div class="mobile-select"><select id="mobileSector"></select></div>|    <div class="mobile-select"><select id="mobileSector"></select></div>|' docs/index.html
          python scripts/add_navigation_home.py
          python scripts/add_nav_collapse.py
          python scripts/add_nav_manager.py
          python scripts/add_favorites_watchlist.py
          python scripts/add_home_trend_chart.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4